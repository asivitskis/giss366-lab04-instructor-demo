<!DOCTYPE html>
<html>
    <head>
        <title>Example - Oregon Ecology Map</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <script src="https://unpkg.com/leaflet-providers/leaflet-providers.js"></script>
        <link href="https://fonts.googleapis.com/css?family=Noto+Sans" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css?family=Lora" rel="stylesheet">
        <link rel="stylesheet" href="css/leaflet.css">
        <script src="js/leaflet.js"></script>
        <!--Update these style features just like you did in Lab 03-->
        <style>
            body {
                margin: 0;
                padding: 0;
                background-color: "whitesmoke";
                font-family: "Noto Sans", sans-serif;
                color: #3d3d3d;
            }
            #title {
                position: fixed;
                margin-top: 0;
                top: 10px;
                left: 50%;
                transform: translateX(-50%);
                font-size: 2em;
                font-family: "Lora", serif;
                letter-spacing: .04em;
                padding: 10px 15px;
                background-color: rgba(168, 163, 240, 0.7);
                border: 1px solid grey;
                border-radius: 3px;
                z-index: 800;
            }
            #description h2 {
                font-family: "Lora", serif;
                letter-spacing: .04em;
            }
            #map {
                position: absolute;
                top: 0;
                bottom: 0;
                width: 100%;
            }
            #description {
                position: fixed;
                bottom: 20px;
                right: 20px;
                width: 280px;
                padding: 0px 15px;
                background-color: rgba(168, 163, 240, 0.7);
                border: 1px solid grey;
                border-radius: 3px;
                z-index: 800;
            }
            #description p {
                font-size: .9em;
                line-height: 1.5em;
            }
            #description a {
                color: #005daa;
                text-decoration: none;
            }
            #description a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <h1 id="title">Example - Oregon Ecology Map</h1>
        <div id="map"></div>
        <div id="description">
            <h2>About this map</h2>
            <p>This is an example map showing ecological data for Oregon.</p>
            <p>Layers included:</p>
            <p> (toggle layers in top right)</p>
            <ul>
                <li>Alternate Open Topo Basemap</li>
                <li>Points of interest</li>
                <li>NLCD Land Cover</li>
            </ul>
            <p>Map authored by: Alex Sivitskis</p>
        </div>
        <script src="https://unpkg.com/leaflet-providers/leaflet-providers.js"></script>
        <script src="map.js"></script>
    </body>
</html>
